const SECS=[['sec','🔒','امنیت و رمز عبور'],['theme','🎨','تم و رنگ برنامه'],['lang','🌐','زبان'],['not','🔔','یادآورها'],['wg','🧩','ویجت صفحهٔ اصلی'],['gen','📱','نمایش، تمام‌صفحه و نصب'],['fin','💰','تنظیمات مدیریت مالی'],['data','💾','پشتیبان‌گیری و بازیابی'],['about','ℹ️','درباره من','go'],['reset','⚠️','ریست کارخانه‌ای','go']];
const swc=(a,on)=>`<button class="tgl${on?' on':''}" data-a="${a}"><i></i></button>`;
const GB='background:var(--track);color:var(--tx);box-shadow:none';
function secBody(id){
 if(id==='sec')return `<div class="srow"><span>نام کاربری</span><b>${esc(AU?AU.u:'')}</b></div><button class="btn" data-a="chpw">تغییر رمز عبور</button><div class="srow"><span>اطلاعات بازیابی رمز</span><b>${AU&&AU.ni?'✓':'—'}</b></div><button class="btn" data-a="chsec" style="${GB}">تنظیم اطلاعات بازیابی</button>${NA?`<div class="srow"><span>ورود با اثر انگشت</span>${swc('tfp',AU&&AU.fp)}</div>`:'<div class="d">ورود با اثر انگشت در نسخهٔ اندروید فعال می‌شود.</div>'}`;
 if(id==='theme'){const t=S.set.th;return `<div class="gh2">رنگ اصلی برنامه</div><div class="thm">${THEMES.map((x,i)=>`<button data-a="thm" data-i="${i}" class="${t&&t[0]===x[1]?'on':''}" style="background:linear-gradient(135deg,${x[1]},${x[2]})"></button>`).join('')}</div>${cpHtml('c',t?t[0]:'#2fa57a','thc','رنگ دلخواه')}<button class="btn" data-a="thr" style="${GB}">بازگشت به رنگ پیش‌فرض</button><div class="gh2">حالت نمایش</div><div class="seg"><button data-a="thl" data-v="light" class="${isDark()?'':'on'}">☀️ روشن</button><button data-a="thl" data-v="dark" class="${isDark()?'on':''}">🌙 تیره</button></div>`}
 if(id==='lang')return `<div class="lgs">${LANGS.map(x=>`<button class="lgb${x[0]===LANG?' on':''}" data-a="lang" data-i="${x[0]}">${x[1]}</button>`).join('')}</div>`;
 if(id==='not')return `<button class="btn" data-a="opcal">📅 باز کردن تقویم شخصی</button><div class="srow"><span>اعلان‌های روزانه</span>${swc('tnot',S.set.on)}</div><label class="l">اعلان شروع روز</label><div class="pk" id="s-m" data-t="tm" data-v="${S.set.m}"></div><label class="l">اعلان پایان روز</label><div class="pk" id="s-e" data-t="tm" data-v="${S.set.e}"></div><button class="btn" data-a="ctest" style="${GB}">اعلان آزمایشی (۵ ثانیه دیگر)</button>${NA?'':'<div class="d">اعلان‌ها فقط در نسخهٔ اندروید کار می‌کنند.</div>'}`;
 if(id==='wg'){const w=wgs();return `<canvas id="wgc" width="1062" height="600" style="width:100%;border-radius:18px;margin-bottom:10px"></canvas><canvas id="wgc2" width="464" height="560" style="width:46%;display:block;margin:0 auto 12px;border-radius:18px"></canvas>${cpHtml('b',w.bg,'wgb','رنگ پس‌زمینه')}${cpHtml('a',w.ac,'wga','رنگ تأکید')}${cpHtml('t',w.tx,'wgt','رنگ متن')}<div class="gh2">شفافیت پس‌زمینه</div><input type="range" id="wgo" min="15" max="100" value="${w.op}" style="width:100%"><button class="btn" data-a="wgap" style="margin-top:12px">اعمال روی ویجت</button><button class="btn" data-a="wgpin" style="${GB}">➕ ویجت گرافیکی ۴×۲ به صفحهٔ اصلی</button><button class="btn" data-a="wgpf" style="${GB}">➕ ویجت مالی ۲×۲ به صفحهٔ اصلی</button><button class="btn" data-a="wgpt" style="${GB}">➕ ویجت ساده (پشتیبان)</button><div class="glass pad" id="wgst" style="margin-top:6px"></div><div class="d">${NA?'ویجت را از لیست ویجت‌های گوشی (نگه‌داشتن روی صفحهٔ اصلی ← Widgets) به اندازهٔ ۴×۲ اضافه کن.':'ویجت فقط در نسخهٔ اندروید فعال است؛ اینجا پیش‌نمایش را می‌بینی.'}</div>`}
 if(id==='gen')return `<div class="srow"><span>حالت تمام‌صفحه</span>${swc('tfs',FS)}</div>${NA?'':'<button class="btn" data-a="inst" style="margin-top:8px">📲 نصب برنامه</button>'}`;
 if(id==='fin')return rSet();
 if(id==='data')return `<p class="d" style="margin:0 0 12px">همهٔ اطلاعات برنامه را در یک فایل ذخیره کن یا فایل پشتیبان نسخهٔ قبلی را به این نسخه اضافه کن.</p><button class="btn" data-a="bk">💾 پشتیبان‌گیری / بازیابی</button>`;return ''}
const aboutHtml=()=>`<button class="btn" data-a="back" style="${GB}">‹ بازگشت به تنظیمات</button><div class="glass pad ab"><img src="icon-192.png" alt=""><h2 style="margin:14px 0 2px">Solo Leveling</h2><p>سلام؛ من سینا هستم، برنامه‌نویسی تازه‌کار با دلی پر از کنجکاوی. «Solo Leveling» نخستین پروژهٔ اندرویدی من است؛ همراهی ساده و زیبا تا هم کارهای هر روزتان را سامان دهید و هم حساب و کتاب مالی‌تان را یک‌جا و روشن در دست داشته باشید.</p><p>ساختن این برنامه برایم فقط نوشتن چند خط کد نبود؛ تلاشی بود برای آنکه هر روز کمی منظم‌تر، کمی آرام‌تر و کمی بهتر از دیروز باشیم. اگر از آن خرسند بودید، خوشحال می‌شوم با نظر و حمایت‌تان مرا در ادامهٔ این راه همراهی کنید. 💚</p></div><a class="glass ct" href="mailto:${CONTACT.email}"><span>✉️</span><div><small>ایمیل</small><b>${CONTACT.email}</b></div></a><a class="glass ct" href="https://t.me/${CONTACT.tg}" target="_blank" rel="noopener"><span>✈️</span><div><small>تلگرام</small><b>@${CONTACT.tg}</b></div></a><a class="glass ct" href="tel:${CONTACT.phone}"><span>📞</span><div><small>شماره تماس</small><b>${CONTACT.phone}</b></div></a><div class="d" style="text-align:center;direction:ltr;margin:16px 0 4px">v 1.4</div>`;
function renderSet(){const el=$('#set');$('#ttl').textContent=SV==='about'?'درباره من':'تنظیمات';
 if(SV==='about'){el.innerHTML=aboutHtml();return}
 el.innerHTML=SECS.map(r=>{const id=r[0],go=r[3],o=SO===id;return `<div class="glass sec${o?' open':''}"><button class="sh" data-a="${go?id:'sec'}" data-i="${id}"><span>${r[1]}</span>${r[2]}${go?'':'<i>▾</i>'}</button>${o&&!go?`<div class="sb">${secBody(id)}</div>`:''}</div>`}).join('');
 if(SO==='theme')cpInit($('#thc'),c=>{const q=hex2hl(c);S.set.th=[c,hsl2hex((q[0]+45)%360,70,Math.min(62,Math.max(42,q[1])))];clearTimeout(window._sv);window._sv=setTimeout(save,500);applyTheme();document.querySelectorAll('.thm button').forEach(b=>b.classList.remove('on'))});
 if(SO==='not'){el.querySelectorAll('.pk').forEach(pkInit);$('#s-m').onchange=()=>{S.set.m=$('#s-m').value||S.set.m;save()};$('#s-e').onchange=()=>{S.set.e=$('#s-e').value||S.set.e;save()}}
 if(SO==='wg'&&typeof WB!=='undefined'&&WB)(async()=>{try{const L=[['main','ویجت گرافیکی'],['fin','ویجت مالی ۲×۲'],['text','ویجت ساده']],e=$('#wgst');let s='<div class="gh2">وضعیت ویجت در این گوشی</div>',err='';for(const k of L){const r=await WB.pin({kind:k[0],go:false});err=r.err||err;s+=`<div class="d">${r.registered?'✅':'❌'} ${k[1]} · ثبت‌شده در سیستم · ${pd(r.count)} روی صفحه</div>`}if(err)s+=`<div class="d" style="color:var(--tw)">⚠ ${esc(err)}</div>`;if(e)e.innerHTML=s}catch(x){}})();
 if(SO==='wg'){WGT=Object.assign({},wgs());const dr=()=>{drawWidget($('#wgc'),WGT);drawWidget2($('#wgc2'),WGT)};[['#wgb','bg'],['#wga','ac'],['#wgt','tx']].forEach(p=>cpInit($(p[0]),c=>{WGT[p[1]]=c;dr()}));$('#wgo').oninput=e=>{WGT.op=+e.target.value;dr()};dr()}}
function setClick(e){const b=e.target.closest('[data-a]');if(!b)return false;const a=b.dataset.a;
 switch(a){
 case 'sec':SO=SO===b.dataset.i?'':b.dataset.i;renderSet();return true;
 case 'about':SV='about';renderSet();scrollTo(0,0);return true;
 case 'back':if(ABP&&ABP!=='set'){const p=ABP;ABP=null;setMode(p)}else{SV='main';renderSet()}return true;
 case 'reset':ask('همهٔ اطلاعات برنامه (تسک‌ها، مالی، حساب و تنظیمات) برای همیشه پاک می‌شود. مطمئنی؟',doReset);return true;
 case 'chpw':form('تغییر رمز عبور',[{k:'o',l:'رمز فعلی',t:'pw',r:1},{k:'n',l:'رمز جدید (حداقل ۶ کاراکتر)',t:'pw',r:1},{k:'n2',l:'تکرار رمز جدید',t:'pw',r:1}],{},async r=>{if(await hpw(r.o,AU.salt)!==AU.h)return toast('رمز فعلی درست نیست');if(r.n.length<6)return toast('رمز جدید خیلی کوتاه است');if(r.n!==r.n2)return toast('تکرار رمز یکسان نیست');AU.salt=rndS();AU.h=await hpw(r.n,AU.salt);putA();toast('رمز عبور تغییر کرد ✅')});return true;
 case 'chsec':fSec();return true;
 case 'tfp':(async()=>{if(AU.fp){AU.fp=false;putA()}else if(await bioAvail()&&await bioOk('فعال‌سازی ورود با اثر انگشت')){AU.fp=true;putA()}else toast('اثر انگشت در دسترس نیست');renderSet()})();return true;
 case 'thm':{const t=THEMES[+b.dataset.i];S.set.th=[t[1],t[2]];save();applyTheme();renderSet();return true}
 case 'lang':try{localStorage.setItem('ertegha-lang',b.dataset.i);sessionStorage.setItem('rl',Date.now())}catch(x){}location.reload();return true;
 case 'opcal':setMode('cal');return true;
 case 'thr':delete S.set.th;save();applyTheme();renderSet();return true;
 case 'thl':setTheme(b.dataset.v,e.clientX,e.clientY);setTimeout(renderSet,600);return true;
 case 'tnot':S.set.on=!S.set.on;save();renderSet();return true;
 case 'ctest':(async()=>{try{await LN.requestPermissions();await mkCh();await LN.schedule({notifications:[{id:9,title:tx('🌿 اعلان آزمایشی'),body:tx('اعلان‌های Solo Leveling کار می‌کنند.'),channelId:'sina',schedule:{at:new Date(Date.now()+5000),allowWhileIdle:true}}]});toast('تا ۵ ثانیهٔ دیگر اعلان می‌آید')}catch(x){toast('اعلان فقط در نسخهٔ اندروید کار می‌کند')}})();return true;
 case 'tfs':$('#fs').click();setTimeout(renderSet,80);return true;
 case 'inst':$('#in').click();return true;
 case 'bk':openBackup();return true;
 case 'wgpin':case 'wgpt':case 'wgpf':(async()=>{if(!WB)return toast('ویجت فقط در نسخهٔ اندروید کار می‌کند');try{const r=await WB.pin({kind:a==='wgpt'?'text':a==='wgpf'?'fin':'main',go:true});if(!r.registered)toast('ویجت در سیستم ثبت نشده است');else if(!r.supported)toast('لانچر گوشی افزودن مستقیم را پشتیبانی نمی‌کند؛ از لیست ویجت‌ها اضافه کن');else toast('درخواست افزودن ویجت ارسال شد؛ تأیید کن')}catch(x){toast('ویجت فقط در نسخهٔ اندروید کار می‌کند')}})();return true;
 case 'wgap':S.set.wg=Object.assign({},WGT);save();sync();toast('ویجت به‌روز شد ✅');return true}
 return false}
$('#logo').onclick=()=>{ABP=MD==='set'?null:MD;setMode('set');SV='about';renderSet();scrollTo(0,0)};
$('#logo').style.cursor='pointer';

const LN=NA&&Capacitor.Plugins.LocalNotifications,WB=NA&&Capacitor.Plugins.WidgetBridge;
if(NA){inst.style.display='none'}
const tm=s=>String(s).replace(/\d/g,d=>fa(d));
const pend=()=>{const t=dk();return S.tasks.filter(x=>!x.done&&(x.date===t||(x.date<t&&!x.tpl&&!x.opt))).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'))};
let chOk=false;
async function mkCh(){if(chOk||!LN)return;try{await LN.createChannel({id:'sina',name:'یادآور روزانه',importance:4,visibility:1})}catch(e){}chOk=true}
let wsig='',nsig='';
async function sync(){if(!NA)return;await refreshAR();const t=dk(),L=pend(),f=FN();
 const ws=JSON.stringify([S.tasks.filter(x=>x.date===t).map(x=>[x.done,x.title,x.em]),S.ev.filter(x=>x.date===t).map(x=>x.title),f.topics.length,L.map(x=>x.id),f.tx.length,f.cards.map(c=>c.balance),f.income,S.set.wg,LANG,t,WAR.main,WAR.fin]);
 if(ws!==wsig){wsig=ws;try{if(WB)await WB.update({...wd(),...wt(),day:t})}catch(e){}}
 const ns=JSON.stringify([L.map(x=>x.title),S.tpls.map(x=>x.title),S.set.on,S.set.m,S.set.e,S.ev.map(x=>[x.date,x.time,x.title]),f.debts.map(x=>[x.id,x.renew,x.done]),LANG,t]);
 if(ns!==nsig){nsig=ns;try{await notif(L)}catch(e){}}}
async function notif(L){if(!LN)return;
 const pd=await LN.getPending();if(pd.notifications.length)await LN.cancel({notifications:pd.notifications});
 if(!S.set.on)return;
 let pm=await LN.checkPermissions();if(pm.display!=='granted'){pm=await LN.requestPermissions();if(pm.display!=='granted')return}
 await mkCh();
 const now=new Date(),out=[],nm=a=>a.slice(0,3).map(x=>x.title).join('، ')+(a.length>3?' و ...':'');
 for(let d=0;d<14;d++)for(const k of ['m','e']){
  const [H,M]=S.set[k].split(':').map(Number),at=new Date(now.getFullYear(),now.getMonth(),now.getDate()+d,H,M,0);
  if(at<=now)continue;let title,body;
  if(k==='m'){const a=d?S.tpls:L;title='🌿 صبح بخیر؛ برنامهٔ امروز';body=a.length?`${fa(a.length)} کار داری: ${nm(a)}`:'روز خوبی بساز؛ تسک‌های امروزت را بچین.'}
  else{if(d===0&&!L.length)continue;title='🌙 مرور پایان روز';body=d?'ببین امروز چه کارهایی مانده؛ هنوز وقت داری.':`${fa(L.length)} کار هنوز انجام نشده: ${nm(L)}`}
  out.push({id:(k==='m'?1000:2000)+d,title,body,channelId:'sina',schedule:{at,allowWhileIdle:true}})}
 S.fin.debts.filter(x=>x.renew&&!x.done).slice(0,10).forEach((x,i)=>{const [H,M]=S.set.m.split(':').map(Number),dd=new Date(x.date+'T12:00:00').getDate(),c=S.fin.contacts.find(k=>k.id===x.contact);for(let m=0;m<3;m++){const at=new Date(now.getFullYear(),now.getMonth()+m,dd,H,M,0);if(at>now)out.push({id:3000+i*3+m,title:'💰 یادآوری '+(x.kind==='owe'?'بدهکاری':'طلب'),body:(c?c.name:'—')+': '+money(x.amount),channelId:'sina',schedule:{at,allowWhileIdle:true}})}});
 S.ev.filter(x=>x.date>=dk()).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).slice(0,15).forEach((x,i)=>{const hm=(x.time||S.set.m).split(':').map(Number),ymd=x.date.split('-').map(Number),at=new Date(ymd[0],ymd[1]-1,ymd[2],hm[0],hm[1],0);if(at>now)out.push({id:4000+i,title:'📅 '+x.title,body:x.desc||'رویداد تقویم شخصی',channelId:'sina',schedule:{at,allowWhileIdle:true}})});
 out.forEach(o=>{o.title=tx(o.title);o.body=tx(o.body)});
 if(out.length)await LN.schedule({notifications:out})}
chargeCards();gen();render();applyTheme();setTimeout(sync,1200);setTimeout(alarmSync,1600);if(NA)setInterval(chkRing,2500);setInterval(webDue,1000);addMics($('#ov'));document.querySelectorAll('.cls').forEach(b=>b.onclick=()=>b.closest('.ov').classList.remove('on'));const relo=()=>{try{return Date.now()-(+sessionStorage.getItem('rl')||0)<15000}catch(e){return false}};relo()?hideLock():showLock();
if(LANG!=='fa'){trTree(document.body);new MutationObserver(ms=>{for(const m of ms)m.addedNodes.forEach(trTree)}).observe(document.body,{childList:true,subtree:true})}
</script>
</body>
</html>
