 case 'acon':fCon();break;case 'econ':fCon(g('contacts'));break;case 'dcon':del('contacts','این مخاطب حذف شود؟');break;

 case 'dtop':{const i=+b.dataset.i;ask('این تاپیک حذف شود؟',()=>{FN().topics.splice(i,1);fsave()});break}
 }};

function openBackup(){form('پشتیبان‌گیری',[],{},()=>{},'بستن');$('#f3-b').innerHTML='<p class="d" style="margin:0 0 12px">با «تهیه نسخهٔ پشتیبان» همهٔ اطلاعات (تسک‌ها، مالی، کارت‌ها، مخاطبین و تنظیمات) در یک فایل ذخیره می‌شود. بعد از نصب دوبارهٔ برنامه، با «بازیابی» همان فایل را انتخاب کن.</p><button class="btn" id="bk-ex">📤 تهیه نسخهٔ پشتیبان</button><button class="btn" id="bk-im" style="background:var(--track);color:var(--tx);box-shadow:none">📥 بازیابی از فایل پشتیبان</button><input type="file" id="bk-f" accept=".json,application/json,text/plain" style="display:none">';

const PF3=new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'});
const g2j=(y,m,d)=>{const p=PF3.formatToParts(new Date(y,m-1,d,12)),g=t=>+p.find(x=>x.type===t||(t==='year'&&x.type==='relatedYear')).value;return[g('year'),g('month'),g('day')]};
const jdi=(y,m,d)=>y*365+(m<=7?(m-1)*31:186+(m-7)*30)+d;
const j2g=(y,m,d)=>{const e=new Date(y+621,2,21,12);e.setDate(e.getDate()+(m<=7?(m-1)*31:186+(m-7)*30)+d-1);for(let i=0;i<8;i++){const c=g2j(e.getFullYear(),e.getMonth()+1,e.getDate());if(c[0]===y&&c[1]===m&&c[2]===d)break;let df=jdi(y,m,d)-jdi(c[0],c[1],c[2]);if(!df)df=(c[0]*10000+c[1]*100+c[2]>y*10000+m*100+d)?-1:1;e.setDate(e.getDate()+df)}return[e.getFullYear(),e.getMonth()+1,e.getDate()]};
const jml=(y,m)=>{if(m<7)return 31;if(m<12)return 30;const g=j2g(y,12,29),n=new Date(g[0],g[1]-1,g[2]+1,12);return g2j(n.getFullYear(),n.getMonth()+1,n.getDate())[2]===30?30:29};
function pkInit(el){const t=el.dataset.t;let op=false;
 const cur=()=>{const v=el.dataset.v||(t==='tm'?nowL().slice(11):t==='d'?nowL().slice(0,10):nowL());const tp=t==='tm'?v:v.slice(11),hm=(tp||'00:00').split(':').map(Number);let jd=null;if(t!=='tm'){const a=v.slice(0,10).split('-').map(Number);jd=g2j(a[0],a[1],a[2])}return{jd,H:hm[0]||0,M:hm[1]||0}};
 const lab=()=>{const v=el.dataset.v;if(!v)return t==='tm'?'انتخاب ساعت':t==='d'?'انتخاب تاریخ':'انتخاب تاریخ و ساعت';const d=new Date((t==='tm'?nowL().slice(0,10):v.slice(0,10))+'T12:00:00').toLocaleDateString('fa-IR-u-ca-persian',{weekday:'short',day:'numeric',month:'long',year:'numeric'});return t==='tm'?pd(v):t==='d'?d:d+' · '+pd(v.slice(11))};
 const put=p=>{const hm=String(p.H).padStart(2,'0')+':'+String(p.M).padStart(2,'0');if(t==='tm')el.dataset.v=hm;else{const g=j2g(p.jd[0],p.jd[1],p.jd[2]),ds=g[0]+'-'+String(g[1]).padStart(2,'0')+'-'+String(g[2]).padStart(2,'0');el.dataset.v=t==='d'?ds:ds+'T'+hm}};
 const col=(c,items,sel)=>`<div class="col">${items.map(a=>`<button type="button" class="it${a[0]===sel?' on':''}" data-c="${c}" data-v="${a[0]}">${a[1]}</button>`).join('')}</div>`;
 function draw(center){const sc=[...el.querySelectorAll('.col')].map(c=>c.scrollTop),p=cur();let body='';
  if(op){if(t!=='tm'){const jy=g2j(...nowL().slice(0,10).split('-').map(Number))[0],ys=[],ds=[];for(let y=jy-5;y<=jy+2;y++)ys.push([y,pd(y)]);for(let d=1;d<=jml(p.jd[0],p.jd[1]);d++)ds.push([d,pd(d)]);
    body+=`<div class="plb">روز · ماه · سال</div><div class="pcs">${col('d',ds,p.jd[2])}${col('m',MN.map((n,i)=>[i+1,n]),p.jd[1])}${col('y',ys,p.jd[0])}</div>`}
   if(t!=='d'){const hs=[],ms=[];for(let i=0;i<24;i++)hs.push([i,pd(String(i).padStart(2,'0'))]);for(let i=0;i<60;i++)ms.push([i,pd(String(i).padStart(2,'0'))]);body+=`<div class="plb" style="margin-top:8px">ساعت · دقیقه</div><div class="pcs" style="direction:ltr">${col('H',hs,p.H)}${col('M',ms,p.M)}</div>`}
   body+='<button type="button" class="pko">تأیید ✓</button>'}
  el.classList.toggle('open',op);
  el.innerHTML=`<button type="button" class="pkb"><span>${lab()}</span><i>▾</i></button>${op?`<div class="pkp">${body}</div>`:''}`;
  el.querySelectorAll('.col').forEach((c,i)=>{if(center){const s=c.querySelector('.on');if(s)c.scrollTop=s.offsetTop-c.clientHeight/2+s.clientHeight/2}else c.scrollTop=sc[i]||0})}
 el.onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.classList.contains('pkb')){op=!op;draw(true)}
  else if(b.classList.contains('pko')){op=false;draw()}
  else if(b.classList.contains('it')){const p=cur(),c=b.dataset.c,v=+b.dataset.v;if(c==='H')p.H=v;else if(c==='M')p.M=v;else{if(c==='d')p.jd[2]=v;if(c==='m')p.jd[1]=v;if(c==='y')p.jd[0]=v;p.jd[2]=Math.min(p.jd[2],jml(p.jd[0],p.jd[1]))}put(p);draw()}};
 Object.defineProperty(el,'value',{get:()=>el.dataset.v||'',set:v=>{el.dataset.v=v||'';draw()},configurable:true});
 draw()}
$('#f3-b').addEventListener('click',e=>{const b=e.target.closest('.ddb,.ddi');if(!b)return;const dd=b.closest('.dd');
 if(b.classList.contains('ddb')){const o=dd.classList.contains('open');document.querySelectorAll('#f3-b .dd.open').forEach(x=>x.classList.remove('open'));if(!o)dd.classList.add('open')}
 else{dd.dataset.v=b.dataset.v;dd.querySelector('.ddb span').textContent=b.textContent;dd.querySelectorAll('.ddi').forEach(x=>x.classList.toggle('on',x===b));dd.classList.remove('open')}});

 const k=pm(new Date());return{img:cv.toDataURL('image/png').split(',')[1],fin:'موجودی: '+short(FN().cards.reduce((s,c)=>s+c.balance,0))+'\nخرج ماه: '+short(sm(tx.filter(t=>PM(t)===k),'out'))}}catch(e){return{}}}
const LN=NA&&Capacitor.Plugins.LocalNotifications,WB=NA&&Capacitor.Plugins.WidgetBridge;

 try{if(WB){let lines=L.slice(0,3).map(x=>'▫️ '+x.title+(x.time?' · '+tm(x.time):'')).join('\n');if(L.length>3)lines+='\n+'+fa(L.length-3)+' مورد دیگر';if(!L.length&&td.length)lines='🎉 همه تسک‌های امروز انجام شد';

async function notif(L){if(!LN)return;

 if(!S.set.on)return;
 let pm=await LN.checkPermissions();if(pm.display!=='granted'){pm=await LN.requestPermissions();if(pm.display!=='granted')return}

 const now=new Date(),out=[],nm=a=>a.slice(0,3).map(x=>x.title).join('، ')+(a.length>3?' و ...':'');
 for(let d=0;d<14;d++)for(const k of ['m','e']){

  else{if(d===0&&!L.length)continue;title='🌙 مرور پایان روز';body=d?'ببین امروز چه کارهایی مانده؛ هنوز وقت داری.':`${fa(L.length)} کار هنوز انجام نشده: ${nm(L)}`}
  out.push({id:(k==='m'?1000:2000)+d,title,body,channelId:'sina',schedule:{at,allowWhileIdle:true}})}
 S.fin.debts.filter(x=>x.renew&&!x.done).slice(0,10).forEach((x,i)=>{const [H,M]=S.set.m.split(':').map(Number),dd=new Date(x.date+'T12:00:00').getDate(),c=S.fin.contacts.find(k=>k.id===x.contact);for(let m=0;m<3;m++){const at=new Date(now.getFullYear(),now.getMonth()+m,dd,H,M,0);if(at>now)out.push({id:3000+i*3+m,title:'💰 یادآوری '+(x.kind==='owe'?'بدهکاری':'طلب'),body:(c?c.name:'—')+': '+money(x.amount),channelId:'sina',schedule:{at,allowWhileIdle:true}})}});
 if(out.length)await LN.schedule({notifications:out})}
